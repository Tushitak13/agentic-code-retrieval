project:
  language: javascript
  source_dir: data/repo
  index_dir: data/index

chunking:
  max_lines: 80
  overlap_lines: 15

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32

reranker:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 30
  final_k: 10

retrieval:
  semantic_top_k: 50
  lexical_top_k: 50
  structural_top_k: 30
  rrf_k: 60

agent:
  enabled: true
  max_passes: 2
  minimum_evidence: 0.55

verification:
  structural_weight: 0.20
  semantic_weight: 0.80